services:
  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: always

  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-8_10
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      CSRF_ENABLED: "False"
    ports:
      - "5050:80"
    depends_on:
      - airflow-db

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-custom
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      PYICEBERG_CATALOG__REST__URI: http://iceberg-rest:8181
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS_KEY_ID: minio_user
      PYICEBERG_CATALOG__REST__S3__SECRET_ACCESS_KEY: minio_pass
      PYICEBERG_CATALOG__REST__S3__PATH_STYLE_ACCESS: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./Data-engineering-project:/dbt
      - ./airflow/requirements.txt:/requirements.txt
      - ./:/opt/airflow/repo
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-custom
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYICEBERG_CATALOG__REST__URI: http://iceberg-rest:8181
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS_KEY_ID: minio_user
      PYICEBERG_CATALOG__REST__S3__SECRET_ACCESS_KEY: minio_pass
      PYICEBERG_CATALOG__REST__S3__PATH_STYLE_ACCESS: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./Data-engineering-project:/dbt
      - ./:/opt/airflow/repo
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    depends_on:
      - airflow-db
    restart: "no"

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_pass
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    restart: always

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    volumes:
      - ./Implementation/iceberg:/etc/iceberg
    depends_on:
      - minio
    restart: always

  mysql:
    container_name: openmetadata_mysql
    image: openmetadata/db:1.10.7
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: openmetadata
    ports:
      - "3306:3306"
    volumes:
      - ./docker-volume/db-data:/var/lib/mysql

  elasticsearch:
    container_name: openmetadata_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  execute-migrate-all:
    image: openmetadata/server:1.10.7
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_PASSWORD: openmetadata
      OM_DATABASE: openmetadata_db
    depends_on:
      - mysql
      - elasticsearch

  openmetadata-server:
    image: openmetadata/server:1.10.7
    container_name: openmetadata_server
    ports:
      - "8586:8585"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_PASSWORD: openmetadata
      OM_DATABASE: openmetadata_db
    depends_on:
      - mysql
      - elasticsearch
      - execute-migrate-all
      
  ingestion:
    image: openmetadata/ingestion:1.10.7
    container_name: openmetadata_ingestion
    depends_on:
      - mysql
      - elasticsearch
      - openmetadata-server
    ports:
      - "8080:8080"


# --- Volumes deklaratsioon ---
volumes:
  pgdata_airflow:
  clickhouse_data:
  es-data:
  db-data:
  minio_data:




