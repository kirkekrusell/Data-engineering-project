version: "3.9"

services:
  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: always

  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-8_10
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      CSRF_ENABLED: "False"
    ports:
      - "5050:80"
    depends_on:
      - airflow-db

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-custom
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      PYICEBERG_CATALOG__REST__URI: http://iceberg-rest:8181
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS_KEY_ID: minio_user
      PYICEBERG_CATALOG__REST__S3__SECRET_ACCESS_KEY: minio_pass
      PYICEBERG_CATALOG__REST__S3__PATH_STYLE_ACCESS: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./Data-engineering-project:/dbt
      - ./airflow/requirements.txt:/requirements.txt
      - ./:/opt/airflow/repo
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-custom
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYICEBERG_CATALOG__REST__URI: http://iceberg-rest:8181
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS_KEY_ID: minio_user
      PYICEBERG_CATALOG__REST__S3__SECRET_ACCESS_KEY: minio_pass
      PYICEBERG_CATALOG__REST__S3__PATH_STYLE_ACCESS: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./Data-engineering-project:/dbt
      - ./:/opt/airflow/repo
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    depends_on:
      - airflow-db
    restart: "no"

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_pass
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    restart: always

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    volumes:
      - ./Implementation/iceberg:/etc/iceberg
    depends_on:
      - minio
    restart: always

  openmetadata-db:
    image: postgres:15
    container_name: openmetadata-db
    environment:
      POSTGRES_USER: omuser
      POSTGRES_PASSWORD: ompass
      POSTGRES_DB: openmetadata
    ports:
      - "5436:5432"
    volumes:
      - openmetadata_data:/var/lib/postgresql/data
    restart: always

  openmetadata:
    image: openmetadata/server:latest
    container_name: openmetadata
    ports:
      - "8585:8585"
    environment:
      DATABASE_USERNAME: omuser
      DATABASE_PASSWORD: ompass
      DATABASE_HOST: openmetadata-db
      DATABASE_PORT: 5432
      DATABASE_DBNAME: openmetadata
    depends_on:
      - openmetadata-db
    volumes:
      - ./Implementation/openmetadata:/openmetadata/config
    restart: always
    
# --- Volumes deklaratsioon ---
volumes:
  pgdata_airflow:
  minio_data:
  clickhouse_data:
  openmetadata_data:





