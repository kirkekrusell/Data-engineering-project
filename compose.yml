version: "3.9"

services:
  # --- Airflow metadata database ---
  airflow-db:
    container_name: airflow-db
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5434:5432"
    volumes:
      - pgdata_airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: always

  # --- pgAdmin UI for Airflow DB ---
  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-8_10
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      CSRF_ENABLED: "False"
    ports:
      - "5050:80"
    depends_on:
      - airflow-db

  # --- Airflow Webserver ---
  airflow-webserver:
    image: airflow-custom
    container_name: airflow-webserver
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # --- PyIceberg REST Catalog ---
      PYICEBERG_CATALOG__REST__URI: http://iceberg-rest:8181
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS_KEY_ID: minio_user
      PYICEBERG_CATALOG__REST__S3__SECRET_ACCESS_KEY: minio_pass
      PYICEBERG_CATALOG__REST__S3__PATH_STYLE_ACCESS: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./Data-engineering-project:/dbt
      - ./airflow/requirements.txt:/requirements.txt
      - ./:/opt/airflow/repo
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  # --- Airflow Scheduler ---
  airflow-scheduler:
    image: airflow-custom
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # --- PyIceberg REST Catalog ---
      PYICEBERG_CATALOG__REST__URI: http://iceberg-rest:8181
      PYICEBERG_CATALOG__REST__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__REST__S3__ACCESS_KEY_ID: minio_user
      PYICEBERG_CATALOG__REST__S3__SECRET_ACCESS_KEY: minio_pass
      PYICEBERG_CATALOG__REST__S3__PATH_STYLE_ACCESS: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/data:/opt/airflow/data
      - ./Data-engineering-project:/dbt
      - ./:/opt/airflow/repo
    depends_on:
      - airflow-init
      - airflow-db
    restart: always

  # --- Airflow DB initialization & user setup ---
  airflow-init:
    image: apache/airflow:2.8.1
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    depends_on:
      - airflow-db
    restart: "no"

  # --- ClickHouse server ---
  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"   # HTTP port
      - "9000:9000"   # Native TCP port
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
    restart: always

  # --- MinIO (S3-compatible storage) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_pass
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API
      - "9003:9001"   # Web console
    volumes:
      - minio_data:/data
    restart: always

  # --- Iceberg REST catalog ---
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    environment:
      JAVA_TOOL_OPTIONS: |
        -Drest-catalog.catalog-impl=org.apache.iceberg.hadoop.HadoopCatalog
        -Drest-catalog.warehouse=s3://warehouse
        -Drest-catalog.s3.endpoint=http://minio:9000
        -Drest-catalog.s3.access-key-id=minio_user
        -Drest-catalog.s3.secret-access-key=minio_pass
        -Drest-catalog.s3.path-style-access=true
    ports:
      - "8181:8181"
    depends_on:
      - minio
    restart: always




